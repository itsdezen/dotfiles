[tools]
# Runtimes
node = "lts"
bun = "latest"
pnpm = "latest"
python = "latest"
uv = "latest"
rust = "stable"
go = "latest"

# Dual-use servers: mason does not install these, so Neovim, an agent and CI all
# resolve the same binary through the shell's PATH.
ruff = "latest"
"npm:basedpyright" = "latest"
"go:golang.org/x/tools/gopls" = "latest"

# CLI used directly, outside Neovim
"npm:cloakbrowser" = "latest"
